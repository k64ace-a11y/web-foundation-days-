<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 5 — Users</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    button {
      padding: 0.5rem 1rem;
      font: inherit;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    input {
      padding: 0.4rem 0.5rem;
      font: inherit;
    }
    #status {
      min-height: 1.5em;
      font-style: italic;
      color: #444;
    }
    #status.error {
      color: #b00020;
      font-style: normal;
    }
    #users-list {
      list-style: none;
      padding: 0;
    }
    #users-list li {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
    }
    #users-list h2 {
      margin: 0 0 0.25rem;
      font-size: 1.1rem;
    }
    #users-list p {
      margin: 0.15rem 0;
      font-size: 0.9rem;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Users</h1>

  <p>
    <button id="load-users" type="button">Load users</button>
  </p>

  <p>
    <label for="filter-input">Filter by name</label>
    <input id="filter-input" type="text" placeholder="e.g. Leanne" autocomplete="off">
  </p>

  <p id="status" role="status"></p>

  <ul id="users-list"></ul>

  <script src="users.js" defer></script>
</body>
</html>
