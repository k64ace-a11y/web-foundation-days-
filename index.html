<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 4 — Live Character Counter</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <header class="card__header">
      <h1>Quick note</h1>
      <button id="theme-toggle" class="btn btn--ghost" type="button">Dark mode</button>
    </header>

    <label for="note-text">Your note</label>
    <textarea
      id="note-text"
      name="note-text"
      rows="8"
      placeholder="Start typing… (max 200 characters)"
    ></textarea>

    <div class="counters">
      <p id="char-count" aria-live="polite">0 / 200 characters</p>
      <p id="word-count" aria-live="polite">0 words</p>
    </div>

    <button id="clear-btn" class="btn" type="button">Clear</button>
  </main>
</body>
</html>
